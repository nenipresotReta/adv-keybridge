CONFIG_ZMK_KEYBOARD_NAME="ADV KeyBridge"
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=5
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_SETTINGS_NVS=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FCB=y
CONFIG_NVS=n
CONFIG_ESP_SPIRAM=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_DISPLAY=n
CONFIG_CARDPUTER_UI=y
CONFIG_ST7789V_RGB565=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
# Reserve more than the ESP adapter minimum for controller allocations and five peers.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=128
CONFIG_LOG=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
# This firmware's status and logs use integer formats only.
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_REBOOT=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_CARDPUTER_SD_LOG=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SPI_SDHC=y
# Never format or overwrite the user's card on mount failure.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=1

# Polling serial shell keeps its output framed while SD continues to log.
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=128
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PRINTF_BUFF_SIZE=384
CONFIG_SHELL_PROMPT_UART="adv> "
CONFIG_LOG_BACKEND_UART=n
CONFIG_CARDPUTER_LOG_CONSOLE=y
